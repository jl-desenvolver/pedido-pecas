<style>

<header><div class="br"><img class="lg" alt="Embritech" src="x"><span>Pedido de peças · Vacinadoras</span><span id=me style="margin-left:auto;display:flex;gap:8px;align-items:center"></span></div><nav id="nv"></nav></header>
<div id=diag></div><main id="app"></main><div id="md"></div><div id="tt"></div>
<script>
/* colocar o apagado aqui: LOGO (troque o "x" pelo valor original) */
const LOGO="x",LR=0.4143;
/* colocar o apagado aqui: SYM (troque o "x" pelo valor original) */
const SYM="x",SR=0.5367;
/* colocar o apagado aqui: catálogo DATA (cole entre o = e o ;) */
const DATA= /* colocar o apagado aqui */ ;
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fold=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(),pad=n=>String(n).padStart(4,'0');
const LS={g(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const blank=()=>({cid:'',obs:'',items:[]});
let catlist=LS.g('ep_cat',['GERAL','ESPECÍFICAS (CA/CP/PS)']),catmap=LS.g('ep_cm',{}),clients=LS.g('ep_c',[]),orders=LS.g('ep_o',[]),custom=LS.g('ep_p',[]),ovr=LS.g('ep_ov',{});
/* vários pedidos em andamento: 'drafts' guarda as abas e 'draft' é sempre a aba atual */
let drafts=LS.g('ep_ds',null);if(!Array.isArray(drafts)||!drafts.length)drafts=[LS.g('ep_d',blank())];
let di=Math.min(+LS.g('ep_di',0)||0,drafts.length-1),draft=drafts[di];
let PH={},view='home',ps={q:'',k:'',s:'',f:0,p:0,n:60},cq='',parts=[],cats=[];
const rc=k=>{let n=0;while(catmap[k]&&n++<20)k=catmap[k];return catlist.includes(k)?k:'GERAL'};
const lsave=()=>{LS.s('ep_cat',catlist);LS.s('ep_cm',catmap);LS.s('ep_c',clients);LS.s('ep_o',orders);LS.s('ep_p',custom);LS.s('ep_ov',ovr);LS.s('ep_ds',drafts);LS.s('ep_di',di)};
const setD=o=>{drafts[di]=o;draft=o},newD=o=>{drafts.push(o||blank());di=drafts.length-1;draft=drafts[di]};
const rmD=()=>{if(drafts.length>1){drafts.splice(di,1);di=Math.min(di,drafts.length-1);draft=drafts[di]}else setD(blank())};
const dn=()=>drafts.reduce((s,d)=>s+d.items.length,0);
function swD(i){di=i;draft=drafts[i];sv();R()}
function clD(){rmD();sv();R()}
function rebuild(){parts=[...DATA.items.map((x,i)=>({...x,id:'b'+i,...(ovr['b'+i]||{})})),...custom].map(x=>({...x,k:rc(x.k)})).sort((a,b)=>a.d.localeCompare(b.d));PH={};parts.forEach(x=>{if(x.g&&!x.gc)PH[x.c]=x.g;x._s=fold([x.c,x.d,x.k,x.o||'',...(x.a||[])].join(' '))});cats=catlist}
function toast(t){const e=$('#tt');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2200)}
function modal(h){$('#md').innerHTML='<div class=mc>'+h+'</div>';$('#md').className='on'}const cm=()=>{$('#md').className=''};
const fl=(id,l,v,t)=>`<label>${l}<input id=${id} type=${t||'text'} value="${esc(v)}"></label>`;
const nvs=[['home','Início'],['parts','Peças'],['cli','Clientes'],['ord','Novo pedido'],['hist','Histórico'],['cat','Categorias']];
function go(v){view=v;R()}
function R(){$('#nv').innerHTML=navs().map(([k,l])=>`<button class="${k==view?'on':''}" onclick="go('${k}')">${l}${k=='ord'&&dn()?'<i>'+dn()+'</i>':''}</button>`).join('');$('#app').innerHTML=V[view]();if(view=='parts')pl();if(view=='usr')ul();scrollTo(0,0)}
const V={home(){const un=DATA.items.length;return `<h2>Bem-vindo</h2><div class=grid><div class="card st"><b>${parts.length.toLocaleString('pt-BR')}</b><span class=mu>peças únicas no catálogo</span></div><div class="card st"><b>${clients.length}</b><span class=mu>clientes cadastrados</span></div><div class="card st"><b>${orders.length}</b><span class=mu>pedidos emitidos</span></div></div>
<div class=grid><button class="card act" onclick="go('ord')"><b>Novo pedido</b><span class=mu>Escolha o cliente, adicione peças e gere o PDF</span></button><button class="card act" onclick="go('parts')"><b>Catálogo de peças</b><span class=mu>Buscar, filtrar por conjunto e cadastrar peças</span></button><button class="card act" onclick="go('cli')"><b>Clientes</b><span class=mu>Cadastro e edição de clientes</span></button><button class="card act" onclick="go('hist')"><b>Histórico</b><span class=mu>Reabrir ou duplicar pedidos e baixar o PDF de novo</span></button></div>
<div class=card><b>Sobre o catálogo</b><p class=mu>Importado de ${DATA.sheets.length} abas da planilha (${DATA.rows.toLocaleString('pt-BR')} linhas). Cada código de estoque aparece uma única vez; as repetições entre conjuntos viraram o filtro “Conjunto” na aba Peças. Fotos do Catálogo de Peças REV-7 (abril/2020): ${DATA.nph} peças com foto. ${DATA.nnew} peças que só aparecem no PDF foram adicionadas e marcadas “só no PDF”. Os dados dos clientes e pedidos ficam salvos neste navegador.</p></div>`},
parts(){return `<h2>Catálogo de peças</h2>${DATA.flag?`<div class=bn>${DATA.flag} peças têm descrições diferentes entre abas da planilha e estão marcadas com “revisar”. Use ✎ para corrigir.</div>`:''}
<div class=tb><input id=pq placeholder="Buscar por código ou descrição…" value="${esc(ps.q)}" oninput="ps.q=this.value;pl()"><select onchange="ps.k=this.value;pl()"><option value="">Todas as categorias</option>${cats.map(c=>`<option ${c==ps.k?'selected':''}>${esc(c)}</option>`).join('')}</select><select onchange="ps.s=this.value;pl()"><option value="">Todos os conjuntos</option>${DATA.sheets.map((s,i)=>`<option value=${i} ${ps.s!==''&&+ps.s==i?'selected':''}>${esc(s)}</option>`).join('')}</select>${can.stock()?'<button class="b p" onclick="pf()">+ Nova peça</button>':''}</div>
<label style="display:flex;gap:6px;align-items:center"><input type=checkbox style="width:auto;margin:0" ${ps.f?'checked':''} onchange="ps.f=+this.checked;pl()"> Só peças para revisar <select style="width:auto;margin-left:12px;padding:3px 6px" onchange="ps.p=+this.value;pl()"><option value=0>Fotos: todas</option><option value=1 ${ps.p==1?'selected':''}>Só com foto</option><option value=2 ${ps.p==2?'selected':''}>Só sem foto</option></select> <span id=cnt style="margin-left:auto"></span></label><div class=card id=plist></div>`},
cli(){const t=fold(cq),l=clients.filter(c=>fold(c.nome+c.doc+c.cidade).includes(t));return `<h2>Clientes</h2><div class=tb><input placeholder="Buscar cliente…" value="${esc(cq)}" oninput="cq=this.value;$('#cl').innerHTML=cl()"><button class="b p" onclick="cf()">+ Novo cliente</button></div><div class=card id=cl>${cl()}</div>`},
ord(){const o=draft,tu=o.items.reduce((s,x)=>s+(+x.q||0),0);
const tabs=`<div class=tb>${drafts.map((d,i)=>{const cn=(clients.find(c=>c.id==d.cid)||{}).nome||'';return `<button class="b ${i==di?'p':''}" onclick="swD(${i})">Pedido ${i+1}${cn?' · '+esc(cn.slice(0,14)):''}${d.items.length?' ('+d.items.length+')':''}</button>`}).join('')}<button class=b onclick="newD();sv();R()">+ Novo pedido</button></div>`;
return `<h2>Novo pedido <span class=mu>${CLOUD?'':'nº '+pad(nextN())}</span></h2>${tabs}<div class=card style="margin-bottom:12px"><label>Cliente<select onchange="draft.cid=this.value;sv();R()"><option value="">Selecione…</option>${clients.map(c=>`<option value=${c.id} ${c.id==o.cid?'selected':''}>${esc(c.nome)}</option>`).join('')}</select></label><button class=b onclick="cf(0,1)">+ Cadastrar novo cliente</button></div>
<div class=card style="margin-bottom:12px"><div class=f2><label>Técnico solicitante<input value="${esc(o.tec||'')}" onchange="draft.tec=this.value;sv()"></label><label>Autorizado por<input value="${esc(o.aut||'')}" onchange="draft.aut=this.value;sv()"></label><label>Tipo de manutenção<select onchange="draft.man=this.value;sv()"><option value="">Selecione…</option>${['Manutenção preventiva','Manutenção preditiva','Manutenção corretiva'].map(m=>`<option ${m==o.man?'selected':''}>${m}</option>`).join('')}</select></label><label>Tipo de envio<select onchange="draft.tipo=this.value;sv()"><option value=""></option>${['Venda','Em garantia'].map(m=>`<option ${m==o.tipo?'selected':''}>${m}</option>`).join('')}</select></label></div><details><summary class=mu>Dados de envio (almoxarifado, opcional)</summary><div class=f2 style="margin-top:8px">${[['nome','Nome completo'],['data','Data de envio'],['transp','Transportadora'],['rast','Código de rastreamento']].map(([k,l])=>`<label>${l}<input value="${esc((o.env||{})[k]||'')}" onchange="(draft.env=draft.env||{}).${k}=this.value;sv()"></label>`).join('')}</div></details></div>
<div class=card style="margin-bottom:12px"><div id=sr><input id=sq placeholder="Adicionar peça: digite código ou descrição…" oninput="os(this.value)"><div id=srs></div></div><div class=tw><table><tr><th><th>Código<th>Descrição<th>Qtd<th></tr>${o.items.map((x,i)=>`<tr><td>${PH[x.c]?`<img class=ph src="${PH[x.c]}">`:''}<td><code>${esc(x.c)}</code><td>${esc(x.d)}<td><input type=number min=0 step=any value="${esc(x.q)}" onchange="draft.items[${i}].q=this.value;sv();tot()"><td><button class=b onclick="rmv(${i})">✕</button></tr>`).join('')||'<tr><td colspan=5 class=mu>Nenhuma peça adicionada ainda.</tr>'}</table></div><p class=mu id=tt2>${o.items.length} itens · ${tu} unidades</p></div>
<div class=card><label>Observações<textarea rows=3 onchange="draft.obs=this.value;sv()">${esc(o.obs)}</textarea></label><p class=mu>As notas em PDF são anexadas depois, no Histórico, no botão “Envio”, quando o pedido for enviado.</p><div class=bar><span><button class="b dg" onclick="setD(blank());sv();R()">Limpar pedido</button>${drafts.length>1?' <button class=b onclick="clD()">Fechar este</button>':''}</span><button class="b p" onclick="gen()">Gerar PDF</button></div></div>`},
cat(){return `<h2>Categorias</h2><div class=tb><input id=nc placeholder="Nome da nova categoria" onkeydown="if(event.key=='Enter')cnew()"><button class="b p" onclick="cnew()">+ Adicionar</button></div><div class=card>${catlist.map((c,i)=>`<div class=r><div class=d><b>${esc(c)}</b><div class=mu>${parts.filter(p=>p.k==c).length} peças</div></div><div class=ac><button class=b onclick="ps.k=catlist[${i}];go('parts')">Ver peças</button><button class=b onclick="cren(${i})">Renomear</button>${c=='GERAL'?'':`<button class="b dg" onclick="cdel(${i})">Excluir</button>`}</div></div>`).join('')}</div><p class=mu>Ao excluir uma categoria, as peças dela voltam para GERAL. Para mudar a categoria de uma peça, use ✎ na aba Peças.</p>`},
usr(){return `<h2>Usuários</h2><div class=card id=ul>Carregando…</div><p class=mu>Para criar um usuário: Supabase → Authentication → Users → Add user. Ele aparece aqui e você define o papel. Cuidado ao mudar o seu próprio papel.</p>`},
hist(){return `<h2>Histórico de pedidos</h2><div class=card>${[...orders].reverse().map(o=>`<div class=r><code>${pad(o.n)}</code><div class=d><b>${esc(o.client.nome)}</b><div class=mu>${new Date(o.date).toLocaleDateString('pt-BR')} · ${o.items.length} itens${o.status?` · <span class="tg ${o.status=='enviado'?'':'w'}">${o.status}</span>`:''}${o.por?` · ${esc(o.por)}`:''}</div></div><div class=ac><button class=b onclick="pdfN(${o.n})">PDF</button><button class=b onclick="dup(${o.n})">Duplicar</button>${can.stock()?`<button class=b onclick="envF(${o.n})">Envio</button>`:''}${CLOUD&&me&&o.id?`<button class=b onclick="pdv(${o.n})">Pendências</button>`:''}${(o.notas||[]).map((a,i)=>`<button class=b title="${esc(a.nome)}" onclick="nota(${o.n},${i})">Nota ${i+1}</button>`).join('')}${can.adm()?`<button class="b dg" onclick="delO(${o.n})">✕</button>`:''}</div></div>`).join('')||'<p class=mu>Nenhum pedido emitido ainda.</p>'}</div>`}};
const cls=c=>{const p=parts.find(p=>p.c==c);return p?p.k:''};
const nextN=()=>Math.max(0,...orders.map(o=>o.n))+1;
function flt(){const t=fold(ps.q).split(/\s+/).filter(Boolean);return parts.filter(x=>(!ps.k||x.k===ps.k)&&(ps.s===''||(x.u||[]).includes(+ps.s))&&(!ps.f||x.f)&&(!ps.p||(ps.p==1?x.g:!x.g))&&t.every(w=>x._s.includes(w)))}
function pl(m){if(!m)ps.n=60;const r=flt();$('#cnt').textContent=r.length.toLocaleString('pt-BR')+' peças';$('#plist').innerHTML=(r.slice(0,ps.n).map(row).join('')||'<p class=mu>Nenhuma peça encontrada.</p>')+(r.length>ps.n?'<p><button class=b onclick="ps.n+=60;pl(1)">Mostrar mais</button></p>':'')}
const row=x=>`<div class=r>${x.g?`<img class="ph${x.gc?' gc':''}" title="${x.gc?'Foto a confirmar':''}" loading=lazy src="${x.g}" onclick="zoom('${x.id}')">`:'<div class="ph ph0"></div>'}<code>${esc(x.c)}</code><div class=d><b>${esc(x.d)}</b>${x.f?' <span class="tg w" title="Descrições diferentes entre abas">revisar</span>':''}${x.s?' <span class=tg>sem cód. de estoque</span>':''}${x.n?' <span class=tg>só no PDF</span>':''}<div class=mu>${esc(x.k)}${x.u?` · em ${x.u.length} conjunto${x.u.length>1?'s':''}`:''}${x.a?` · também: ${esc(x.a.slice(0,2).join('; '))}`:''}</div></div><div class=ac><input type=number min=0 step=any value=1 id="q${x.id}"><button class="b p" onclick="add('${x.id}')">+ Pedido</button>${can.stock()?`<button class=b title=Editar onclick="pf('${x.id}')">✎</button>`:''}</div></div>`;
function zoom(id){const x=parts.find(p=>p.id==id);modal(`<img src="${x.g}" style="width:100%;max-width:420px;display:block;margin:0 auto;border-radius:8px"><p><code>${esc(x.c)}</code><br><b>${esc(x.d)}</b></p>${x.gc?`<p class=mu>Foto a confirmar: as abas da planilha têm fotos diferentes para este código. Ela não vai para o PDF do pedido.</p>${can.stock()?`<button class="b p" onclick="gok('${id}')">Confirmar foto</button>`:''}`:''}<div class=bar><span></span><button class=b onclick=cm()>Fechar</button></div>`)}

function envF(n){const o=orders.find(x=>x.n==n),e=o.env||{},nt=o.notas||[],up=CLOUD&&o.id;
modal(`<h3>Dados de envio · pedido ${pad(n)}</h3>${fl('e1','Nome completo (almoxarifado)',e.nome||(me?me.nome:''))}${fl('e2','Data de envio',e.data||new Date().toLocaleDateString('pt-BR'))}${fl('e3','Transportadora',e.transp)}${fl('e4','Código de rastreamento',e.rast)}<label>Tipo de envio<select id=e5><option></option>${['Venda','Em garantia'].map(m=>`<option ${m==o.tipo?'selected':''}>${m}</option>`).join('')}</select></label><label>Status<select id=e6>${['pendente','enviado'].map(m=>`<option ${m==(o.status||'pendente')?'selected':''}>${m}</option>`).join('')}</select></label>${up?`<label>Anexar nota (PDF, até 10 MB cada)<input id=e7 type=file accept="application/pdf,.pdf" multiple></label>${nt.length?`<p class=mu>Notas já anexadas: ${nt.map(a=>esc(a.nome)).join(', ')}</p>`:''}`:''}<div class=bar><span><button class=b onclick=cm()>Cancelar</button></span><span><button class=b onclick="envS(${n},0)">Salvar</button> <button class="b p" onclick="envS(${n},1)">Salvar e gerar PDF</button></span></div>`)}
async function upN(o,files){const out=[];for(const f of files){const p=o.id+'/'+Date.now()+'_'+f.name.replace(/[^\w.\-]+/g,'_');const r=await cld(sb.storage.from('notas').upload(p,f,{contentType:'application/pdf'}));if(!r)return null;out.push({nome:f.name,path:p})}return out}
async function envS(n,pdf){const o=orders.find(x=>x.n==n),inp=$('#e7'),files=inp?[...inp.files]:[];
for(const f of files){if(!(f.type=='application/pdf'||/\.pdf$/i.test(f.name)))return toast('A nota precisa ser um arquivo PDF');if(f.size>10*1048576)return toast('O PDF '+f.name+' passa de 10 MB')}
const bk={env:o.env,tipo:o.tipo,status:o.status,notas:o.notas};
o.env={nome:$('#e1').value.trim(),data:$('#e2').value.trim(),transp:$('#e3').value.trim(),rast:$('#e4').value.trim()};o.tipo=$('#e5').value;o.status=$('#e6').value;
if(files.length){toast('Enviando nota…');const u=await upN(o,files);if(!u){Object.assign(o,bk);return}o.notas=[...(o.notas||[]),...u]}
if(CLOUD&&o.id){const {n:_n,id:_i,status:_s,...rest}=o;if(!await cld(sb.from('pedidos').update({dados:rest,status:o.status}).eq('id',o.id))){Object.assign(o,bk);return}}
lsave();cm();R();toast('Dados de envio salvos'+(files.length?' e nota anexada':''));if(pdf)pdfOut(o)}
async function nota(n,i){const o=orders.find(x=>x.n==n),a=(o.notas||[])[i];if(!a)return;const w=window.open('','_blank');const r=await cld(sb.storage.from('notas').createSignedUrl(a.path,300));if(!r){if(w)w.close();return}if(w)w.location=r.data.signedUrl;else location.href=r.data.signedUrl}
async function delOk(n){const o=orders.find(x=>x.n==n);if(CLOUD&&o&&o.id&&!await cld(sb.from('pedidos').delete().eq('id',o.id)))return;orders=orders.filter(x=>x.n!=n);lsave();cm();R()}

/* ===== PENDÊNCIAS (itens que ficaram pendentes no almoxarifado) ===== */
let PD=[];
async function pdv(n){const o=orders.find(x=>x.n==n);if(!o||!o.id)return toast('Pedido ainda não sincronizado');const r=await cld(sb.from('pendencias').select('*').eq('pedido_id',o.id).order('criado_em'));if(!r)return;PD=r.data||[];pdm(n)}
function pdm(n){const o=orders.find(x=>x.n==n),S=['pendente','enviado','cancelado'];
modal(`<h3>Pendências · pedido ${pad(n)}</h3>${PD.map(p=>`<div class=r><div class=d><b>${esc(p.codigo||'')}</b> ${esc(p.descricao)} · qtd ${esc(p.qtd)}${p.obs?`<div class=mu>${esc(p.obs)}</div>`:''}</div><div class=ac>${can.stock()?`<select style="width:auto" onchange="pds('${p.id}',this.value,${n})">${S.map(s=>`<option ${s==p.status?'selected':''}>${s}</option>`).join('')}</select>`:`<span class="tg ${p.status=='enviado'?'':'w'}">${esc(p.status)}</span>`}${can.adm()?`<button class="b dg" onclick="pdd('${p.id}',${n})">✕</button>`:''}</div></div>`).join('')||'<p class=mu>Nenhuma pendência registrada.</p>'}
${can.stock()?`<hr style="border:0;border-top:1px solid var(--bd);margin:12px 0"><label>Escolher item do pedido (opcional)<select id=pi onchange="pfill(${n},this.value)"><option value="">—</option>${o.items.map((x,i)=>`<option value=${i}>${esc(x.c)} · ${esc(x.d)}</option>`).join('')}</select></label>${fl('pc','Código','')}${fl('pdd','Descrição *','')}${fl('pq','Quantidade pendente','1','number')}<label>Observação<textarea id=po rows=2></textarea></label><button class="b p" onclick="pda(${n})">+ Registrar pendência</button>`:''}
<div class=bar><span></span><button class=b onclick=cm()>Fechar</button></div>`)}
function pfill(n,i){if(i==='')return;const o=orders.find(x=>x.n==n),x=o.items[+i];$('#pc').value=x.c;$('#pdd').value=x.d;$('#pq').value=x.q}
async function pda(n){const o=orders.find(x=>x.n==n),d=$('#pdd').value.trim();if(!d)return toast('Informe a descrição');
const r=await cld(sb.from('pendencias').insert({pedido_id:o.id,codigo:$('#pc').value.trim(),descricao:d,qtd:+$('#pq').value||1,obs:$('#po').value.trim(),criado_por:me.id}).select().single());if(!r)return;PD.push(r.data);pdm(n);toast('Pendência registrada')}
async function pds(id,s,n){const r=await cld(sb.from('pendencias').update({status:s,atualizado_em:nowIso()}).eq('id',id));if(!r)return;const p=PD.find(x=>x.id==id);if(p)p.status=s;toast('Status atualizado')}
async function pdd(id,n){if(!await cld(sb.from('pendencias').delete().eq('id',id)))return;PD=PD.filter(x=>x.id!=id);pdm(n)}
boot();
</script><script>if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))</script><script type="module" src="https://static.cloudflareinsights.com/beacon.min.js/vce701823e78c4301a35b7e07294d87301792088814092" integrity="sha512-UKNk8GbxkABxKcXYuLkO16EleLGUkcvJWtpSNmExE0Too3ZaFAxTscNWEc1OdAv5/BikHawapSCaiD2XCmp+Bw==" data-cf-beacon='{"version":"2024.11.0","token":"55d6c902a8a143b1ab6c5051b2a1f75b","spa":2}' crossorigin="anonymous"></script>
