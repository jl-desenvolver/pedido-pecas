            --wn: #9a4a00;

        }

        @media(prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #0f151c;
                --sf: #18212b;
                --tx: #e8edf3;
                --mu: #92a1b3;
                --bd: #2a3644;
                --pr: #4b9bea;
                --pt: #07121f;
                --pb: #16293f;
                --wn: #f0b36a;
                --wb: #33260f;
                --dg: #ff8a80

        }

            --tx: #e8edf3;
            --mu: #92a1b3;
            --bd: #2a3644;
            --pr: #4b9bea;
            --pt: #07121f;
            --pb: #16293f;
            --wn: #f0b36a;
            --wb: #33260f;
            --dg: #ff8a80
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--tx);
            font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0 0 auto;
            height: env(safe-area-inset-top, 0px);
            background: var(--sf);
            z-index: 10
        }

        header {
            position: sticky;
            top: env(safe-area-inset-top, 0px);
            z-index: 9;
            background: var(--sf);
            border-bottom: 1px solid var(--bd);
            padding: 10px 16px 0
        }

        .br img.lg {
            height: 46px;
            width: auto;
            background: #fff;
            border-radius: 6px;
            padding: 3px 8px
        }

        .br {
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: 1000px;
            margin: auto
        }

        .br b {
            font-size: 18px;
            letter-spacing: .5px;
            color: var(--pr)
        }

        .br span {
            color: var(--mu);
            font-size: 13px
        }

        nav {
            display: flex;
            gap: 2px;
            max-width: 1000px;
            margin: 6px auto 0;
            overflow-x: auto
        }

        nav button {
            background: none;
            border: 0;
            border-bottom: 3px solid transparent;
            padding: 9px 12px;
            font: inherit;
            color: var(--mu);
            cursor: pointer;
            white-space: nowrap
        }

        nav button.on {
            color: var(--pr);
            border-color: var(--pr);
            font-weight: 600
        }

        nav i {
            font-style: normal;
            background: var(--pr);
            color: var(--pt);
            border-radius: 9px;
            padding: 0 6px;
            font-size: 12px;
            margin-left: 4px
        }

        main {
            max-width: 1000px;
            margin: auto;
            padding: 16px
        }

        h2 {
            margin: 4px 0 12px;
            font-size: 20px
        }

        h3 {
            margin: 0 0 12px
        }

        .card {
            background: var(--sf);
            border: 1px solid var(--bd);
            border-radius: 10px;
            padding: 14px
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 14px
        }

        .st b {
            display: block;
            font-size: 28px;
            color: var(--pr)
        }

        .mu {
            color: var(--mu);
            font-size: 13px
        }

        .act {
            cursor: pointer;
            text-align: left;
            font: inherit;
            color: inherit
        }

        .act:hover {
            border-color: var(--pr)
        }

        .act b {
            display: block;
            margin-bottom: 2px
        }

        input,
        select,
        textarea {
            font: inherit;
            color: var(--tx);
            background: var(--bg);
            border: 1px solid var(--bd);
            border-radius: 8px;
            padding: 8px 10px;
            width: 100%
        }

        label {
            display: block;
            font-size: 13px;
            color: var(--mu);
            margin-bottom: 10px
        }

        label input,
        label select,
        label textarea {
            margin-top: 3px
        }

        .b {
            font: inherit;
            border: 1px solid var(--bd);
            background: var(--sf);
            color: var(--tx);
            border-radius: 8px;
            padding: 8px 13px;
            cursor: pointer
        }

        .b.p {
            background: var(--pr);
            color: var(--pt);
            border-color: var(--pr);
            font-weight: 600
        }

        .b.dg {
            color: var(--dg)
        }

        .b:disabled {
            opacity: .5
        }

        .tb {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 10px
        }

        .tb>* {
            flex: 1 1 160px;
            width: auto
        }

        .tb .b {
            flex: 0 0 auto
        }

        .r {
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 10px 4px;
            border-bottom: 1px solid var(--bd);
            flex-wrap: wrap
        }

        .r code {
            flex: 0 0 86px;
            font-size: 13px;
            color: var(--pr);
            word-break: break-all
        }

        .r .d {
            flex: 1 1 240px;
            min-width: 0
        }

        .ac {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap
        }

        .ac input {
            width: 66px;
            padding: 6px
        }

        .ph {
            width: 72px;
            height: 54px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid var(--bd);
            flex: 0 0 72px;
            background: var(--bg);
            cursor: zoom-in
        }

        .ph0 {
            cursor: default
        }

        .ph.gc {
            border: 2px dashed var(--wn)
        }

        td .ph {
            width: 56px;
            height: 42px;
            flex: none
        }

        .tg {
            font-size: 11px;
            background: var(--pb);
            color: var(--pr);
            border-radius: 5px;
            padding: 1px 6px
        }

        .tg.w {
            background: var(--wb);
            color: var(--wn)
        }

        .bn {
            background: var(--wb);
            color: var(--wn);
            border-radius: 8px;
            padding: 9px 12px;
            margin-bottom: 12px;
            font-size: 13px
        }

        .f2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0 12px
        }

        @media(max-width:560px) {
            .f2 {
                grid-template-columns: 1fr
            }
        }

        #md {
            display: none;
            position: fixed;
            inset: 0;
            background: #0008;
            z-index: 20;
            align-items: flex-start;
            justify-content: center;
            padding: calc(env(safe-area-inset-top, 0px) + 20px) 12px 20px;
            overflow: auto
        }

        #md.on {
            display: flex
        }

        .mc {
            background: var(--sf);
            border-radius: 12px;
            padding: 18px;
            width: 100%;
            max-width: 520px
        }

        .bar {
            display: flex;
            gap: 8px;
            justify-content: space-between;
            margin-top: 6px
        }

        #sr {
            position: relative
        }

        #sr .rs {
            position: absolute;
            left: 0;
            right: 0;
            z-index: 5;
            background: var(--sf);
            border: 1px solid var(--bd);
            border-radius: 8px;
            max-height: 300px;
            overflow: auto;
            box-shadow: 0 6px 18px #0003
        }

        #sr .rs div {
            padding: 8px 10px;
            cursor: pointer;
            border-bottom: 1px solid var(--bd)
        }

        #sr .rs div:hover {
            background: var(--pb)
        }

        #tt {
            position: fixed;
            left: 50%;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
            transform: translateX(-50%);
            background: var(--tx);
            color: var(--bg);
            padding: 9px 16px;
            border-radius: 20px;
            z-index: 30;
            display: none;
            font-size: 14px
        }

        .tw {
            overflow-x: auto
        }

        table {
            border-collapse: collapse;
            width: 100%;
            min-width: 480px
        }

        th,
        td {
            text-align: left;
            padding: 8px 6px;
            border-bottom: 1px solid var(--bd)
        }

        th {
            font-size: 12px;
            color: var(--mu)
        }

        td input {
            width: 80px;
            padding: 5px
        }
    </style>
</head>

        async function out() {await sb.auth.signOut(); me = null;['ep_c', 'ep_o', 'ep_p', 'ep_ov', 'ep_d', 'ep_ds', 'ep_cat', 'ep_cm'].forEach(k => {try {localStorage.removeItem(k)} catch (e) { } }); clients = []; orders = []; draft = {cid: '', obs: '', items: []}; DR = [draft]; di = 0; loginView()}
        async function boot() {rebuild(); if (!CLOUD) {if (window.EP_CFG) {const why = whyNot(); $('#diag').innerHTML = `<div class=bn style="max-width:1000px;margin:8px auto">Modo local, sem login: ${why}. Versão ${APP_V}.</div>`} R(); return } const {data} = await sb.auth.getSession(); if (data && data.session) await afterLogin(data.session.user); else loginView()}
        document.addEventListener('visibilitychange', () => {if (CLOUD && me && !document.hidden && !$('#md').className) pull().then(() => {if (['home', 'hist', 'cli'].includes(view)) R()})});
        async function ul() {
            const {data, error} = await sb.from('profiles').select('*').order('nome'); if (error) {$('#ul').textContent = 'Erro: ' + error.message; return }
            $('#ul').innerHTML = data.map(u => `<div class=r><div class=d><b>${esc(u.nome)}</b><div class=mu>${esc(u.email)}</div></div><div class=ac><select onchange="upu('${u.id}',{papel:this.value})">${Object.entries(PAPEL).map(([k, v]) => `<option value=${k} ${k == u.papel ? 'selected' : ''}>${v}</option>`).join('')}</select><label style="margin:0;display:flex;gap:4px;align-items:center"><input type=checkbox style="width:auto" ${u.ativo ? 'checked' : ''} onchange="upu('${u.id}',{ativo:this.checked})"> ativo</label><button class=b onclick="unm('${u.id}')">Nome</button></div></div>`).join('')
        }
        async function upu(id, p) {const r = await cld(sb.from('profiles').update(p).eq('id', id)); if (r) toast('Usuário atualizado')}
        function unm(id) {modal(`<h3>Nome do usuário</h3>${fl('un', 'Nome', '')}<div class=bar><span></span><span><button class=b onclick=cm()>Cancelar</button> <button class="b p" onclick="unm2('${id}')">Salvar</button></span></div>`)}
        async function unm2(id) {const n = $('#un').value.trim(); if (!n) return; await upu(id, {nome: n}); cm(); ul()}
        function envF(n) {const o = orders.find(x => x.n == n), e = o.env || {}; modal(`<h3>Dados de envio · pedido ${pad(n)}</h3>${fl('e1', 'Nome completo (almoxarifado)', e.nome || (me ? me.nome : ''))}${fl('e2', 'Data de envio', e.data || new Date().toLocaleDateString('pt-BR'))}${fl('e3', 'Transportadora', e.transp)}${fl('e4', 'Código de rastreamento', e.rast)}<label>Tipo de envio<select id=e5><option></option>${['Venda', 'Em garantia'].map(m => `<option ${m == o.tipo ? 'selected' : ''}>${m}</option>`).join('')}</select></label><label>Status<select id=e6>${['pendente', 'enviado'].map(m => `<option ${m == (o.status || 'pendente') ? 'selected' : ''}>${m}</option>`).join('')}</select></label><div class=bar><span><button class=b onclick=cm()>Cancelar</button></span><span><button class=b onclick="envS(${n},0)">Salvar</button> <button class="b p" onclick="envS(${n},1)">Salvar e gerar PDF</button></span></div>`)}
        async function envS(n, pdf) {
            const o = orders.find(x => x.n == n); o.env = {nome: $('#e1').value.trim(), data: $('#e2').value.trim(), transp: $('#e3').value.trim(), rast: $('#e4').value.trim()}; o.tipo = $('#e5').value; o.status = $('#e6').value;
            if (CLOUD && o.id) {const {n: _n, id: _i, status: _s, ...rest} = o; if (!await cld(sb.from('pedidos').update({dados: rest, status: o.status}).eq('id', o.id))) return }
            lsave(); cm(); R(); toast('Dados de envio salvos'); if (pdf) pdfOut(o)
        }
        async function delOk(n) {const o = orders.find(x => x.n == n); if (CLOUD && o && o.id && !await cld(sb.from('pedidos').delete().eq('id', o.id))) return; orders = orders.filter(x => x.n != n); lsave(); cm(); R()}

        /* ===== Vários pedidos ===== */
        const dn = (d, i) => {const c = clients.find(x => x.id == d.cid); return c ? c.nome.slice(0, 18) : 'Pedido ' + (i + 1)};
        const dt = () => {DR[di] = draft; return `<div class=tb style="align-items:center">${DR.map((d, i) => `<button class="b${i == di ? ' p' : ''}" onclick="selD(${i})">${esc(dn(d, i))}${d.items.length ? ' (' + d.items.length + ')' : ''}</button>`).join('')}<button class=b onclick="newD()">+ Novo pedido</button>${DR.length > 1 ? `<button class="b dg" onclick="delD(${di})">Descartar este</button>` : ''}</div>`};
        function newD() {DR[di] = draft; DR.push({cid: '', obs: '', items: []}); di = DR.length - 1; draft = DR[di]; sv(); R()}
        function selD(i) {DR[di] = draft; di = i; draft = DR[di]; sv(); R()}
        function delD(i) {if (!confirm('Descartar este rascunho?')) return; DR.splice(i, 1); if (!DR.length) DR.push({cid: '', obs: '', items: []}); if (i < di) di--; di = Math.min(di, DR.length - 1); draft = DR[di]; sv(); R()}
        function finD() {if (DR.length > 1) {DR.splice(di, 1); di = Math.max(0, di - 1)} else DR[0] = {cid: '', obs: '', items: []}; draft = DR[di]; sv()}

        /* ===== Notas em PDF (bucket privado "notas") ===== */
        const nt = () => !CLOUD ? '' : `<div class=card style="margin-bottom:12px"><b>Notas em PDF</b>${(draft.notas || []).map((x, i) => `<div class=r><div class=d>${esc(x.nome)}</div><div class=ac><button class=b onclick="ntV('${x.path}')">Abrir</button><button class="b dg" onclick="ntR(${i})">Remover</button></div></div>`).join('')}<label>Anexar PDF (até 10 MB)<input type=file accept="application/pdf" onchange="ntU(this)"></label></div>`;
        async function ntU(el) {
            const f = el.files[0]; if (!f) return; if (f.type != 'application/pdf') return toast('Só arquivos PDF'); if (f.size > 10485760) return toast('Máximo de 10 MB');
            const d = draft; d.uid = d.uid || (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())); const path = me.id + '/' + d.uid + '/' + Date.now() + '_' + fold(f.name).replace(/[^a-z0-9.]+/g, '_');
            toast('Enviando PDF…'); const r = await cld(sb.storage.from('notas').upload(path, f, {contentType: 'application/pdf'})); if (!r) return; (d.notas = d.notas || []).push({nome: f.name, path}); sv(); R(); toast('PDF anexado')
        }
        const ntR = i => {draft.notas.splice(i, 1); sv(); R()};
        async function ntV(path) {const r = await cld(sb.storage.from('notas').createSignedUrl(path, 300)); if (!r) return; modal(`<h3>Nota em PDF</h3><p><a href="${r.data.signedUrl}" target="_blank" rel="noopener">Abrir PDF</a></p><p class=mu>O link vale por 5 minutos.</p><div class=bar><span></span><button class=b onclick=cm()>Fechar</button></div>`)}

        /* ===== Pendências do almoxarifado ===== */
        let PD = [];
        async function pdO(n) {const o = orders.find(x => x.n == n); if (!CLOUD || !o || !o.id) return toast('Disponível só com login'); const r = await cld(sb.from('pendencias').select('*').eq('pedido_id', o.id).order('criado_em')); if (!r) return; PD = r.data; pdR(n)}
        function pdR(n) {
            const o = orders.find(x => x.n == n), S = can.stock(); modal(`<h3>Pendências · pedido ${pad(n)}</h3>${PD.map(p => `<div class=r><div class=d><b>${esc(p.codigo || '')}</b> ${esc(p.descricao || '')} · qtd ${esc(p.qtd)}${p.obs ? `<div class=mu>${esc(p.obs)}</div>` : ''}</div><div class=ac>${S ? `<select onchange="pdU('${p.id}',${n},this.value)">${['pendente', 'separado', 'entregue'].map(s => `<option ${s == p.status ? 'selected' : ''}>${s}</option>`).join('')}</select>${can.adm() ? `<button class="b dg" onclick="pdD('${p.id}',${n})">✕</button>` : ''}` : `<span class="tg w">${esc(p.status)}</span>`}</div></div>`).join('') || '<p class=mu>Nenhuma pendência registrada.</p>'}
${S ? `<h3 style="margin-top:14px">Registrar item pendente</h3><label>Item do pedido<select onchange="pdF(${n},this.value)"><option value="">Escolher…</option>${o.items.map((x, i) => `<option value=${i}>${esc(x.c)} · ${esc(x.d).slice(0, 40)}</option>`).join('')}</select></label>${fl('pc', 'Código', '')}${fl('pd', 'Descrição', '')}${fl('pq', 'Quantidade', '1', 'number')}${fl('po', 'Observação', '')}<button class="b p" onclick="pdA(${n})">Adicionar pendência</button>` : ''}<div class=bar><span></span><button class=b onclick=cm()>Fechar</button></div>`)
        }
        function pdF(n, i) {if (i === '') return; const x = orders.find(o => o.n == n).items[i]; $('#pc').value = x.c; $('#pd').value = x.d; $('#pq').value = x.q}
        async function pdA(n) {
            const o = orders.find(x => x.n == n), c = $('#pc').value.trim(), d = $('#pd').value.trim(); if (!c && !d) return toast('Informe o item');
            const r = await cld(sb.from('pendencias').insert({pedido_id: o.id, codigo: c, descricao: d, qtd: +$('#pq').value || 1, obs: $('#po').value.trim()})); if (r) {toast('Pendência registrada'); pdO(n)}
        }
        async function pdU(id, n, s) {const r = await cld(sb.from('pendencias').update({status: s, atualizado_em: nowIso()}).eq('id', id)); if (r) toast('Status atualizado')}
        async function pdD(id, n) {if (!confirm('Excluir esta pendência?')) return; const r = await cld(sb.from('pendencias').delete().eq('id', id)); if (r) pdO(n)}
        boot();
    </script>
